rules:
- id: banned-import-domain-microsoft-entityframeworkcore
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''Microsoft.EntityFrameworkCore''
    referansı kesinlikle yasaktır.'
  patterns:
  - pattern: using Microsoft.EntityFrameworkCore;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: banned-import-domain-microsoft-aspnetcore
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''Microsoft.AspNetCore'' referansı
    kesinlikle yasaktır.'
  patterns:
  - pattern: using Microsoft.AspNetCore;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: banned-import-domain-system-data
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''System.Data'' referansı kesinlikle
    yasaktır.'
  patterns:
  - pattern: using System.Data;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: banned-import-domain-system-io
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''System.IO'' referansı kesinlikle
    yasaktır.'
  patterns:
  - pattern: using System.IO;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: banned-import-domain-system-net-http
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''System.Net.Http'' referansı
    kesinlikle yasaktır.'
  patterns:
  - pattern: using System.Net.Http;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: banned-import-domain-azure-messaging
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-054 / R-ARCH-003: Domain katmanında ''Azure.Messaging'' referansı
    kesinlikle yasaktır.'
  patterns:
  - pattern: using Azure.Messaging;
  - pattern-inside: namespace $...Domain { ... }
  metadata:
    category: architecture
    standards:
    - ISO 25010/Maintainability
    - Clean Architecture
- id: opengrep-no-notimplemented-exception
  languages:
  - csharp
  severity: ERROR
  message: 'R-SOLID-004: NotImplementedException üretim kodunda bulunamaz; arayüz
    segregasyonu (ISP) uygulayın veya metodu somutlaştırın.'
  patterns:
  - pattern: throw new NotImplementedException($...ARGS);
  metadata:
    rule_id: R-SOLID-004
    severity: S1
    standards:
      cwe:
      - CWE-670
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-class-and-method-length-limits
  languages:
  - csharp
  severity: INFO
  message: 'R-SOLID-010: Sınıf boyutu ≤ 400 satır, metot boyutu ≤ 60 satır sınırına
    uymalıdır.'
  patterns:
  - pattern: class  { ... }
  metadata:
    rule_id: R-SOLID-010
    severity: S3
    standards:
      iso25010:
      - Maintainability/Analysability
- id: opengrep-cancellation-token-propagation
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-004: Asenkron I/O metot imzalarında CancellationToken ct = default
    bulunmalı ve alt çağrılara iletilmelidir.'
  patterns:
  - pattern: async Task ($...PARAMS) { ... }
  metadata:
    rule_id: R-NET-004
    severity: S1
    standards:
      cwe:
      - CWE-400
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-no-await-in-lock
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-006: lock bloğu içinde await kullanılamaz; SemaphoreSlim.WaitAsync
    tercih edilmelidir.'
  patterns:
  - pattern: lock () { ... await ; ... }
  metadata:
    rule_id: R-NET-006
    severity: S1
    standards:
      cwe:
      - CWE-833
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-semaphore-released-in-finally
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-070: SemaphoreSlim / Mutex serbest bırakma çağrıları (Release) daima
    finally bloğunda yapılmalıdır.'
  patterns:
  - pattern: .WaitAsync(...); ... .Release();
  metadata:
    rule_id: R-NET-070
    severity: S1
    standards:
      cwe:
      - CWE-667
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-parallel-no-async-lambda
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-071: Parallel.ForEach içinde async lambda kullanılamaz; Parallel.ForEachAsync
    kullanılmalıdır.'
  patterns:
  - pattern: Parallel.ForEach(, async () => { ... });
  metadata:
    rule_id: R-NET-071
    severity: S2
    standards:
      iso25010:
      - Reliability/Concurrency
- id: opengrep-threadstatic-asynclocal-audit
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-072: ThreadStatic ve AsyncLocal kullanımı gerekçelendirilmeli ve
    bellek sızıntısına karşı denetlenmelidir.'
  patterns:
  - pattern: '[ThreadStatic] ...;'
  - pattern: AsyncLocal<> ;
  metadata:
    rule_id: R-NET-072
    severity: S2
    standards:
      cwe:
      - CWE-362
      iso25010:
      - Reliability/Concurrency
- id: opengrep-bounded-collections
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-073: Sınırsız bellek büyümesini önlemek için kuyruklar daima sınırlandırılmış
    (bounded) olmalıdır.'
  patterns:
  - pattern: Channel.CreateUnbounded<>($...ARGS)
  metadata:
    rule_id: R-NET-073
    severity: S2
    standards:
      cwe:
      - CWE-770
      iso25010:
      - Reliability/ResourceUtilization
- id: opengrep-meaningful-exception-logging
  languages:
  - csharp
  severity: WARNING
  message: 'R-SEC-001: Yakalanan istisnalar Information yerine Error/Warning seviyesinde
    ve tam yığın iziyle loglanmalıdır.'
  patterns:
  - pattern: catch () { .LogInformation($...ARGS); }
  metadata:
    rule_id: R-SEC-001
    severity: S2
    standards:
      cwe:
      - CWE-390
      iso25010:
      - Reliability/Analysability
- id: opengrep-no-throw-ex-rethrow
  languages:
  - csharp
  severity: WARNING
  message: 'R-SEC-002: throw ex kullanımı çağrı yığınını sıfırlar; orijinal yığını
    korumak için çıplak throw; kullanılmalıdır.'
  patterns:
  - pattern: catch ( ) { ... throw ; }
  metadata:
    rule_id: R-SEC-002
    severity: S2
    standards:
      cwe:
      - CWE-703
      iso25010:
      - Reliability/Analysability
- id: opengrep-no-throw-raw-exception
  languages:
  - csharp
  severity: WARNING
  message: 'R-SEC-003: Ham Exception veya SystemException fırlatmak yasaktır; spesifik
    domain istisnası veya Result.Failure kullanın.'
  patterns:
  - pattern: throw new Exception($...ARGS);
  - pattern: throw new SystemException($...ARGS);
  metadata:
    rule_id: R-SEC-003
    severity: S2
    standards:
      cwe:
      - CWE-397
      iso25010:
      - Maintainability/Analysability
- id: opengrep-do-not-swallow-operationcanceled
  languages:
  - csharp
  severity: ERROR
  message: 'R-SEC-004: OperationCanceledException yutulamaz; akış derhal sonlandırılmalı
    veya hata yeniden fırlatılmalıdır.'
  patterns:
  - pattern: catch (OperationCanceledException) { }
  - pattern: catch (TaskCanceledException) { }
  metadata:
    rule_id: R-SEC-004
    severity: S1
    standards:
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-do-not-catch-fatal-exceptions
  languages:
  - csharp
  severity: ERROR
  message: 'R-SEC-005: Kritik sistem istisnaları (OutOfMemory, StackOverflow) yakalanıp
    yutulamaz.'
  patterns:
  - pattern: catch (OutOfMemoryException) { ... }
  - pattern: catch (StackOverflowException) { ... }
  - pattern: catch (ExecutionEngineException) { ... }
  metadata:
    rule_id: R-SEC-005
    severity: S1
    standards:
      cwe:
      - CWE-390
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-no-exception-leak-to-client
  languages:
  - csharp
  severity: WARNING
  message: 'R-SEC-006: İç sistem istisna detayları ve stack trace istemciye ham dönemez
    (CWE-209).'
  patterns:
  - pattern: return StatusCode(500, .ToString());
  - pattern: return Problem(.StackTrace);
  metadata:
    rule_id: R-SEC-006
    severity: S2
    standards:
      cwe:
      - CWE-209
      asvs:
      - V16
- id: opengrep-no-empty-catch
  languages:
  - csharp
  severity: ERROR
  message: 'R-SEC-007: Boş catch bloğu kesinlikle yasaktır (CWE-390); hata loglanmalı
    veya yönetilmelidir.'
  patterns:
  - pattern: catch () { }
  - pattern: catch { }
  metadata:
    rule_id: R-SEC-007
    severity: S1
    standards:
      cwe:
      - CWE-390
      - CWE-703
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-catch-specific-exception-types
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-080: catch bloğu yalnızca spesifik istisna tiplerini yakalamalıdır;
    genel catch loglayıp yeniden fırlatmalıdır.'
  patterns:
  - pattern: catch (Exception) { ... }
  metadata:
    rule_id: R-NET-080
    severity: S2
    standards:
      cwe:
      - CWE-396
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-exception-filters-no-side-effects
  languages:
  - csharp
  severity: INFO
  message: 'R-NET-081: Exception filtreleri yan etki içeremez; yalnızca saf durum
    kontrolü yapmalıdır.'
  patterns:
  - pattern: catch () when ((...))
  metadata:
    rule_id: R-NET-081
    severity: S3
    standards:
      cwe:
      - CWE-703
      iso25010:
      - Reliability/FaultTolerance
- id: opengrep-security-events-logged
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-083: Güvenlik olayları (oturum açma başarısızlığı, yetki reddi)
    açıkça audit loguna yazılmalıdır.'
  patterns:
  - pattern: class  { ... }
  metadata:
    rule_id: R-NET-083
    severity: S1
    standards:
      asvs:
      - V16
      iso21434:
      - CSMS/AuditLogging
- id: opengrep-structured-logging-no-interpolation
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-085: Loglamada string birleştirme veya interpolasyon yasaktır; yapılandırılmış
    loglama şablonu kullanın.'
  patterns:
  - pattern: .LogTrace( + )
  - pattern: .LogDebug( + )
  - pattern: .LogInformation( + )
  - pattern: .LogWarning( + )
  - pattern: .LogError( + )
  - pattern: .LogCritical( + )
  metadata:
    rule_id: R-NET-085
    severity: S2
    standards:
      iso25010:
      - Maintainability/Analysability
- id: opengrep-log-level-convention
  languages:
  - csharp
  severity: INFO
  message: 'R-NET-086: İstisna nesnesi içeren log çağrıları Information değil Warning
    veya Error seviyesinde olmalıdır.'
  patterns:
  - pattern: .LogInformation(, $...ARGS)
  metadata:
    rule_id: R-NET-086
    severity: S3
    standards:
      asvs:
      - V16
- id: opengrep-pii-in-cache-key
  languages:
  - csharp
  severity: WARNING
  message: 'R-PII-005: PII alanları (TCKN, Email, Telefon) önbellek anahtarında düz
    metin olarak kullanılamaz.'
  patterns:
  - pattern: .Set( + , ...)
  metadata:
    rule_id: R-PII-005
    severity: S2
    standards:
      cwe:
      - CWE-524
      kvkk:
      - m.12 veri güvenliği
- id: opengrep-pii-in-url-query
  languages:
  - csharp
  severity: ERROR
  message: 'R-PII-006: PII alanları URL query string içinde taşınamaz (CWE-598); POST
    gövdesinde şifreli taşınmalıdır.'
  patterns:
  - pattern: Request.Query["tckn"]
  - pattern: Request.Query["email"]
  - pattern: Request.Query["phone"]
  - pattern: Request.Query["iban"]
  metadata:
    rule_id: R-PII-006
    severity: S1
    standards:
      cwe:
      - CWE-598
      asvs:
      - V14
      kvkk:
      - m.12 veri güvenliği
- id: opengrep-tostring-no-pii
  languages:
  - csharp
  severity: WARNING
  message: 'R-PII-008: ToString() metotları PII alanlarını maskelemeden düz metin
    sızdıramaz.'
  patterns:
  - pattern: public override string ToString() { return ... + Tckn + ...; }
  metadata:
    rule_id: R-PII-008
    severity: S2
    standards:
      cwe:
      - CWE-532
      kvkk:
      - m.12 veri güvenliği
- id: opengrep-no-real-pii-in-tests
  languages:
  - csharp
  severity: ERROR
  message: 'R-PII-009: Test fixture''larında gerçek kişisel veri kullanılamaz; Bogus
    ile sentetik veri üretilmelidir.'
  patterns:
  - pattern: '11111111110'
  - pattern: '12345678901'
  metadata:
    rule_id: R-PII-009
    severity: S1
    standards:
      kvkk:
      - m.4 genel ilkeler
- id: opengrep-allow-anonymous-comment-justification
  languages:
  - csharp
  severity: WARNING
  message: 'R-AUTH-002: [AllowAnonymous] kullanılan her endpoint üzerinde iş gerekçesini
    açıklayan bir açıklama bulunmalıdır.'
  patterns:
  - pattern: '[AllowAnonymous]'
  metadata:
    rule_id: R-AUTH-002
    severity: S2
    standards:
      asvs:
      - V8
- id: opengrep-jwt-validation-parameters
  languages:
  - csharp
  severity: ERROR
  message: 'R-AUTH-004: JWT doğrulamasında ValidateIssuer, ValidateAudience ve ValidateLifetime
    açıkça true olmalıdır.'
  patterns:
  - pattern: ValidateIssuer = false
  - pattern: ValidateAudience = false
  - pattern: ValidateLifetime = false
  metadata:
    rule_id: R-AUTH-004
    severity: S1
    standards:
      asvs:
      - V9
      cwe:
      - CWE-347
- id: opengrep-jwt-require-https-metadata
  languages:
  - csharp
  severity: ERROR
  message: 'R-AUTH-005: JWT yapılandırmasında RequireHttpsMetadata = false yapılması
    kesinlikle yasaktır.'
  patterns:
  - pattern: RequireHttpsMetadata = false
  metadata:
    rule_id: R-AUTH-005
    severity: S1
    standards:
      asvs:
      - V12
      cwe:
      - CWE-319
- id: opengrep-roles-from-constants
  languages:
  - csharp
  severity: WARNING
  message: 'R-AUTH-007: Rol isimleri magic string olamaz; strongly-typed sabitlerden
    gelmelidir (Roles.Admin).'
  patterns:
  - pattern: '[Authorize(Roles = "Admin")]'
  - pattern: '[Authorize(Roles = "User")]'
  metadata:
    rule_id: R-AUTH-007
    severity: S2
    standards:
      iso25010:
      - Maintainability/Modifiability
- id: opengrep-xml-reader-dtd-disabled
  languages:
  - csharp
  severity: ERROR
  message: 'R-INJ-005: XML okuyucularda DTD parsing açık bırakılamaz; DtdProcessing.Prohibit
    zorunludur (XXE).'
  patterns:
  - pattern: DtdProcessing = DtdProcessing.Parse
  metadata:
    rule_id: R-INJ-005
    severity: S1
    standards:
      cwe:
      - CWE-611
      owasp_top10:
      - A05:2021
- id: opengrep-typenamehandling-prohibited
  languages:
  - csharp
  severity: ERROR
  message: 'R-INJ-006: JSON deserialization işlemlerinde TypeNameHandling.All veya
    Auto kullanımı kesinlikle yasaktır (RCE).'
  patterns:
  - pattern: TypeNameHandling = TypeNameHandling.All
  - pattern: TypeNameHandling = TypeNameHandling.Auto
  metadata:
    rule_id: R-INJ-006
    severity: S1
    standards:
      cwe:
      - CWE-502
      owasp_top10:
      - A08:2021
- id: opengrep-regex-injection-and-redos
  languages:
  - csharp
  severity: WARNING
  message: 'R-INJ-008: Regex kullanıcı girdisinden derlenemez; Regex timeout tanımlanmalıdır
    (ReDoS).'
  patterns:
  - pattern: new Regex()
  metadata:
    rule_id: R-INJ-008
    severity: S2
    standards:
      cwe:
      - CWE-1333
- id: opengrep-deserialization-depth-limit
  languages:
  - csharp
  severity: WARNING
  message: 'R-INJ-010: Deserialization işlemlerinde maksimum derinlik ve boyut sınırı
    tanımlanmalıdır.'
  patterns:
  - pattern: MaxDepth = 0
  metadata:
    rule_id: R-INJ-010
    severity: S2
    standards:
      cwe:
      - CWE-400
- id: opengrep-secure-password-hashing
  languages:
  - csharp
  severity: ERROR
  message: 'R-CRY-004: Parola saklamada ham SHA yasaktır; Argon2id, PBKDF2 veya bcrypt
    kullanılmalıdır.'
  patterns:
  - pattern: SHA256.HashData(Encoding.UTF8.GetBytes())
  metadata:
    rule_id: R-CRY-004
    severity: S1
    standards:
      cwe:
      - CWE-916
      asvs:
      - V11
- id: opengrep-no-certificate-validation-bypass
  languages:
  - csharp
  severity: ERROR
  message: 'R-CRY-005: SSL/TLS sertifika doğrulaması bypass edilemez (CWE-295).'
  patterns:
  - pattern: ServerCertificateCustomValidationCallback = (, , , ) => true
  - pattern: ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
  metadata:
    rule_id: R-CRY-005
    severity: S1
    standards:
      cwe:
      - CWE-295
      asvs:
      - V12
- id: opengrep-tls-min-version
  languages:
  - csharp
  severity: ERROR
  message: 'R-CRY-006: Minimum TLS sürümü ≥ 1.2 olmalıdır; eski protokoller yasaktır.'
  patterns:
  - pattern: SecurityProtocol = SecurityProtocolType.Ssl3
  - pattern: SecurityProtocol = SecurityProtocolType.Tls11
  metadata:
    rule_id: R-CRY-006
    severity: S1
    standards:
      cwe:
      - CWE-326
      asvs:
      - V12
- id: opengrep-no-static-iv
  languages:
  - csharp
  severity: ERROR
  message: 'R-CRY-007: Kriptografik IV (Initialization Vector) sabit olamaz; her işlemde
    rastgele üretilmelidir.'
  patterns:
  - pattern: IV = new byte[] { ... }
  - pattern: 'IV = '
  metadata:
    rule_id: R-CRY-007
    severity: S1
    standards:
      cwe:
      - CWE-329
- id: opengrep-key-material-not-string
  languages:
  - csharp
  severity: WARNING
  message: 'R-CRY-008: Kriptografik anahtarlar bellekte düz metin string olarak tutulamaz;
    byte[] ve ZeroMemory kullanılmalıdır.'
  patterns:
  - pattern: string  = "secret-key-123456";
  metadata:
    rule_id: R-CRY-008
    severity: S2
    standards:
      cwe:
      - CWE-316
- id: opengrep-no-http-plain-url
  languages:
  - csharp
  severity: ERROR
  message: 'R-CRY-009: Kaynak kodda http:// şemalı URL sabitleri yasaktır; daima https://
    kullanılmalıdır.'
  patterns:
  - pattern-regex: '"http://(?!localhost|127\.0\.0\.1).*"'
  metadata:
    rule_id: R-CRY-009
    severity: S1
    standards:
      cwe:
      - CWE-319
      asvs:
      - V12
- id: opengrep-readonly-query-asnotracking
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-010: Salt okunur sorgularda .AsNoTracking() kullanımı zorunludur.'
  patterns:
  - pattern: ..Where(...).ToList()
  metadata:
    rule_id: R-NET-010
    severity: S2
    standards:
      iso25010:
      - Performance/ResourceUtilization
- id: opengrep-prefer-select-projection-over-include
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-011: Derin Include zincirleri yerine doğrudan DTO projeksiyonu (Select)
    yapılmalıdır.'
  patterns:
  - pattern: .Include( => .).Include( => .).Include( => .)
  metadata:
    rule_id: R-NET-011
    severity: S2
    standards:
      iso25010:
      - Performance/ResourceUtilization
- id: opengrep-no-lazy-loading
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-012: Lazy loading kapalı olmalıdır; N+1 sorgu zincirlerini engellemek
    için açık yükleme yapın.'
  patterns:
  - pattern: UseLazyLoadingProxies()
  metadata:
    rule_id: R-NET-012
    severity: S1
    standards:
      cwe:
      - CWE-1050
- id: opengrep-no-singleton-dbcontext
  languages:
  - csharp
  severity: ERROR
  message: 'R-NET-014: DbContext kesinlikle Singleton olarak kaydedilemez; Scoped
    olmalıdır.'
  patterns:
  - pattern: services.AddSingleton<>()
  metadata:
    rule_id: R-NET-014
    severity: S1
    standards:
      cwe:
      - CWE-543
- id: opengrep-entity-type-configuration-classes
  languages:
  - csharp
  severity: WARNING
  message: 'R-NET-015: Entity konfigürasyonları OnModelCreating içinde şişirilmemeli,
