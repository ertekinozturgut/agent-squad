# ==============================================================================
# UDAP .NET v2 — CodeQL C# veri akışı (data-flow) model uzantıları
#
# CodeQL data-extension dosyalarının ŞEMASI katıdır: üst düzeyde yalnızca
# `extensions:` bulunabilir (pack adı/sürümü qlpack.yml içindedir), ve C# için
# satır uzunlukları sabittir:
#
#   sourceModel  : [namespace, type, subtypes, name, signature, ext, output, kind, provenance]
#   sinkModel    : [namespace, type, subtypes, name, signature, ext, input,  kind, provenance]
#   neutralModel : [namespace, type, name, signature, kind, provenance]
#
# İzlenen PII alanları (.agents/contract.yaml -> pii.fields ile aynı tutulmalıdır):
#   Tckn, Vkn, Email, Phone, PlateNumber, Vin, ChassisNo, EngineNo,
#   DriverLicenseNo, Iban, Address, BirthDate
# ==============================================================================
extensions:

  # ---------------------------------------------------------------- KAYNAKLAR
  - addsTo:
      pack: codeql/csharp-all
      extensible: sourceModel
    data:
      - ["Company.Integration", "ServiceBusEnvelope", false, "Body", "", "", "ReturnValue", "remote", "manual"]
      - ["Company.Integration.Crm", "CrmWebhookPayload", false, "RawJson", "", "", "ReturnValue", "remote", "manual"]

  # ------------------------------------------------------------------ HEDEFLER
  - addsTo:
      pack: codeql/csharp-all
      extensible: sinkModel
    data:
      - ["Company.Logging", "AuditLogger", false, "Write", "(System.Object)", "", "Argument[0]", "log-injection", "manual"]
      - ["Company.Data", "SqlRunner", false, "Execute", "(System.String)", "", "Argument[0]", "sql-injection", "manual"]
      - ["Company.Integration", "SalesforceClient", false, "Post", "(System.String,System.Object)", "", "Argument[1]", "request-forgery", "manual"]

  # ------------------------------------------------ SANITIZER / NÖTR METOTLAR
  - addsTo:
      pack: codeql/csharp-all
      extensible: neutralModel
    data:
      - ["Company.Common", "Sanitizer", "Escape", "(System.String)", "summary", "manual"]
      - ["Company.Common", "Redactor", "Mask", "(System.String)", "summary", "manual"]
